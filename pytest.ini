[pytest]
# Restrict default collection to the Empire test suite. Without this, a
# bare `pytest` invocation sweeps the whole repo and collects test files
# bundled with installed plugins under empire/server/plugins/*/tests/.
# Those get imported before empire/test/conftest.py runs, so config_manager
# initializes from the production config instead of test_server_config.yaml.
testpaths = empire/test
log_cli = false
log_cli_level = INFO
# Should figure out a better way to do this, but for now filters out all the
# warnings from the threads exiting.
filterwarnings =
    ignore::pytest.PytestUnhandledThreadExceptionWarning
env =
    TEST_MODE=true
