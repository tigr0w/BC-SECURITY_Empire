name: Get-Route
authors:
  - name: Anthony Rose
    handle: '@Cx01N'
    link: https://twitter.com/Cx01N_
description: |
  Returns the IPv4 routing table (destination, netmask, next hop, interface,
  metric) as JSON. Output feeds the server-side route_filter so the result
  renders as a PowerShell-style table. Replaces the legacy in-agent
  `shell route` alias.
software: ''
tactics: [TA0007]
techniques: [T1016]
background: false
output_extension:
needs_admin: false
opsec_safe: true
language: powershell
min_language_version: '2'
comments:
  - Replaces the in-agent route alias removed in Empire 7.0.
options:
  - name: Agent
    description: Agent to run module on.
    required: true
    value: ''
script: |
  function Get-Route {
      try {
          $adapters = @{};
          Get-WmiObject Win32_NetworkAdapterConfiguration -ErrorAction Stop | ForEach-Object { $adapters[[int]($_.InterfaceIndex)] = $_.IPAddress };
          Get-WmiObject win32_IP4RouteTable -ErrorAction Stop | ForEach-Object {
              $out = New-Object psobject;
              $out | Add-Member Noteproperty 'Destination' $_.Destination;
              $out | Add-Member Noteproperty 'Netmask' $_.Mask;
              if ($_.NextHop -eq "0.0.0.0") {
                  $out | Add-Member Noteproperty 'NextHop' 'On-link';
              }
              else {
                  $out | Add-Member Noteproperty 'NextHop' $_.NextHop;
              }
              if($adapters[$_.InterfaceIndex] -and ($adapters[$_.InterfaceIndex] -ne "")) {
                  $out | Add-Member Noteproperty 'Interface' $($adapters[$_.InterfaceIndex] -join ",");
              }
              else {
                  $out | Add-Member Noteproperty 'Interface' '127.0.0.1';
              }
              $out | Add-Member Noteproperty 'Metric' $_.Metric1;
              $out;
          } | ConvertTo-Json
      }
      catch {
          "[!] route module failed: $_"
      }
  }
script_end: Get-Route
