name: WDigest Plaintext Credential Caching Toggle
authors:
  - name: Cornelis de Plaa
    handle: '@Cneelis'
    link: https://github.com/outflanknl/C2-Tool-Collection
description: |
  Beacon Object File (BOF) that patches the WDigest authentication provider
  in LSASS memory to re-enable plaintext credential caching, and patches
  Credential Guard's wdigest.dll stub to bypass in-memory credential
  protection. After execution, credentials entered by any user will be stored
  in plaintext in LSASS and recoverable by tools such as Mimikatz sekurlsa.
  Requires administrator privileges and SeDebugPrivilege. x64 only — WDigest
  memory offsets are not available for 32-bit LSASS.
