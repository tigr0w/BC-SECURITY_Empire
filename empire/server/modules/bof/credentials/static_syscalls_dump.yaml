name: static_syscalls_dump
authors:
  - name: ajpc500
    handle: '@ajpc500'
    link: https://github.com/ajpc500/BOFs
description: |
  Beacon Object File (BOF) that dumps memory of the target PID using static
  syscall numbers (NtReadVirtualMemory with hardcoded SSNs) to avoid ntdll
  API hook interception. Intended as a companion to nanodump for environments
  where Dbghelp-based or API-hooked dump paths are monitored. Output is
  written to disk at the specified path. Requires SeDebugPrivilege. x64 only.
software: ''
tactics: [TA0006]
techniques: [T1003.001]
background: false
output_extension:
needs_admin: true
opsec_safe: false
language: bof
min_language_version: ''
comments:
  - https://github.com/ajpc500/BOFs
options:
  - name: Architecture
    description: Architecture of the BOF to use (x64 only).
    required: true
    value: x64
    strict: true
    suggested_values:
      - x64
  - name: Pid
    description: Process ID of the target process to dump (e.g. LSASS PID).
    required: true
    value: '4'
  - name: OutputPath
    description: Full path on the target to write the dump file.
    required: true
    value: 'C:\Windows\Temp\lsass.dmp'
bof:
  x86: ''
  x64: bof/credentials/static_syscalls_dump/syscallsdump.x64.o
  entry_point: ''
  format_string: 'iz'
script_path: ''
script_end: ''
