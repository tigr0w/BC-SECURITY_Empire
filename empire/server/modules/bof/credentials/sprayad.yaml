name: sprayad
authors:
  - name: Cornelis de Plaa
    handle: '@Cneelis'
    link: https://github.com/outflanknl/C2-Tool-Collection
  - name: BC Security
description: |
  Beacon Object File (BOF) that performs a fast Kerberos or LDAP password spraying attack against Active Directory. Tests all enabled domain user accounts for a single supplied password, with an optional LDAP filter to target specific accounts (for example admin* or service accounts). Kerberos spraying generates event ID 4771 (Kerberos pre-authentication failed), which is not audited by default on domain controllers and may evade detection, while LDAP spraying is faster but generates event ID 4625 (logon failure). Always review the domain password and lockout policy before spraying to avoid locking out accounts.
software: ''
tactics: [TA0006]
techniques: [T1110.003]
background: false
output_extension:
needs_admin: false
opsec_safe: false
language: bof
min_language_version: ''
comments:
  - https://github.com/outflanknl/C2-Tool-Collection
options:
  - name: Architecture
    description: Architecture of the beacon_funcs.o to generate with (x64 or x86).
    required: true
    value: x64
    strict: true
    suggested_values:
      - x64
      - x86
  - name: Password
    description: The single password to spray against every enabled Active Directory
      user account.
    required: true
    value: 'Welcome123'
  - name: Filter
    description: Optional LDAP sAMAccountName filter to limit which accounts are
      sprayed (for example admin* or svc*). Use * to target all enabled accounts.
    required: false
    value: '*'
  - name: AuthService
    description: Authentication service to spray with. Set to 'ldap' for a fast LDAP
      spray (noisy, event ID 4625) or clear this field to perform a stealthier Kerberos
      spray (event ID 4771).
    required: false
    value: 'ldap'
bof:
  x86: bof/credentials/sprayad/sprayad.x86.o
  x64: bof/credentials/sprayad/sprayad.x64.o
  entry_point: ''
  format_string: 'ZZZ'
script_path: ''
script_end: ''
