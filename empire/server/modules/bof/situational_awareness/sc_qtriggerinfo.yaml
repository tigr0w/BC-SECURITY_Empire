name: sc_qtriggerinfo
authors:
  - name: Anthony Rose
    handle: '@Cx01N'
    link: https://twitter.com/Cx01N_
description: Queries the trigger events configured for a named Windows service on
  a local or remote host via the Service Control Manager, showing the conditions
  (device events, network events, etc.) that automatically start or stop the service.
software: ''
tactics: [TA0007]
techniques: [T1007]
background: false
output_extension:
needs_admin: false
opsec_safe: true
language: bof
min_language_version: ''
comments:
  - https://github.com/trustedsec/CS-Situational-Awareness-BOF
options:
  - name: Architecture
    description: Architecture of the beacon_funcs.o to generate with (x64 or x86).
    required: true
    value: x64
    strict: true
    suggested_values:
      - x64
      - x86
  - name: Hostname
    description: Remote host to query. Leave blank to target the local machine.
    required: false
    value: ''
  - name: ServiceName
    description: Name of the service to query.
    required: true
    value: ''
bof:
  x86: bof/situational_awareness/sc_qtriggerinfo/sc_qtriggerinfo.x86.o
  x64: bof/situational_awareness/sc_qtriggerinfo/sc_qtriggerinfo.x64.o
  entry_point: ''
  format_string: zz
script_path: ''
script_end: ''
advanced:
  custom_generate: true
