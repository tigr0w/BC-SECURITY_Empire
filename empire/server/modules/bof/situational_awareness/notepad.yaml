name: notepad
authors:
  - name: Anthony Rose
    handle: '@Cx01N'
    link: https://twitter.com/Cx01N_
description: Enumerates open Notepad and Notepad++ process windows and extracts the
  file path or unsaved text currently displayed in each editor instance. Useful for
  opportunistic collection of credentials or notes stored in memory.
software: ''
tactics: [TA0009]
techniques: [T1005]
background: false
output_extension:
needs_admin: false
opsec_safe: true
language: bof
min_language_version: ''
comments:
  - https://github.com/trustedsec/CS-Situational-Awareness-BOF
options:
  - name: Architecture
    description: Architecture of the beacon_funcs.o to generate with (x64 or x86).
    required: true
    value: x64
    strict: true
    suggested_values:
      - x64
      - x86
bof:
  x86: bof/situational_awareness/notepad/notepad.x86.o
  x64: bof/situational_awareness/notepad/notepad.x64.o
  entry_point: ''
  format_string: ''
script_path: ''
script_end: ''
