name: sc_query
authors:
  - name: Anthony Rose
    handle: '@Cx01N'
    link: https://twitter.com/Cx01N_
description: Beacon Object File (BOF) that queries the Windows Service Control Manager
  (SCM) to enumerate services or retrieve the status of a specific service on a local
  or remote host. When no service name is provided, lists all services and their
  current state. Useful for identifying running or stopped services during host enumeration
  without touching disk.
software: ''
tactics: [TA0007]
techniques: [T1007]
background: false
output_extension:
needs_admin: false
opsec_safe: true
language: bof
min_language_version: ''
comments:
  - https://github.com/trustedsec/CS-Situational-Awareness-BOF
options:
  - name: Architecture
    description: Architecture of the beacon_funcs.o to generate with (x64 or x86).
    required: true
    value: x64
    strict: true
    suggested_values:
      - x64
      - x86
  - name: Hostname
    description: Remote host to query. Leave blank to target the local machine.
    required: false
    value: ''
  - name: ServiceName
    description: Service name to query. Leave blank to enumerate all services.
    required: false
    value: ''
bof:
  x86: bof/situational_awareness/sc_query/sc_query.x86.o
  x64: bof/situational_awareness/sc_query/sc_query.x64.o
  entry_point: ''
  format_string: zz
script_path: ''
script_end: ''
advanced:
  custom_generate: true
