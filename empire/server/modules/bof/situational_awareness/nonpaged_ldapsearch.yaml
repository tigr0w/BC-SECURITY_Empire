name: nonpaged_ldapsearch
authors:
  - name: Anthony Rose
    handle: '@Cx01N'
    link: https://twitter.com/Cx01N_
description: Beacon Object File (BOF) that runs non-paged LDAP queries against a
  domain controller directly from the agent via ldap_search_s (synchronous, unpaged).
  Bypasses LDAP result-set paging, which can be useful when standard paged queries
  are throttled or restricted. Returns results without touching disk. Wraps the TrustedSec
  nonpagedldapsearch BOF to enumerate Active Directory objects such as users, groups,
  and computers using a raw LDAP filter and an optional attribute list.
software: ''
tactics: [TA0007]
techniques: [T1087.002, T1069.002, T1018]
background: false
output_extension:
needs_admin: false
opsec_safe: true
language: bof
min_language_version: ''
comments:
  - https://github.com/trustedsec/CS-Situational-Awareness-BOF
options:
  - name: Architecture
    description: Architecture of the beacon_funcs.o to generate with (x64 or x86).
    required: true
    value: x64
    strict: true
    suggested_values:
      - x64
      - x86
  - name: Query
    description: LDAP search filter to execute, e.g. (objectClass=user).
    required: true
    value: '(objectClass=user)'
  - name: Attributes
    description: Comma-separated attributes to return; * returns all.
    required: false
    value: '*'
  - name: ResultCount
    description: Maximum number of results to return. 0 returns all results.
    required: true
    value: '0'
  - name: Hostname
    description: Domain controller to target. Leave blank to auto-resolve.
    required: false
    value: ''
  - name: Domain
    description: Domain name to query against. Leave blank to use the current domain.
    required: false
    value: ''
bof:
  x86: bof/situational_awareness/nonpagedldapsearch/nonpagedldapsearch.x86.o
  x64: bof/situational_awareness/nonpagedldapsearch/nonpagedldapsearch.x64.o
  entry_point: ''
  format_string: zzizz
script_path: ''
script_end: ''
