name: findLoadedModule
authors:
  - name: Anthony Rose
    handle: '@Cx01N'
    link: https://twitter.com/Cx01N_
description: Enumerates running processes and reports those that have a given module
  (DLL) loaded, matching on a case-insensitive substring of the module's full path.
  Useful for locating clean injection targets (e.g. processes already loading clr.dll,
  winhttp.dll, or amsi.dll) and for fingerprinting EDR/security products by their
  injected DLLs. Optionally restrict the search to processes whose image name matches
  a substring. Enumerating modules in other sessions' processes typically requires
  SeDebugPrivilege.
software: ''
tactics: [TA0007, TA0005]
techniques: [T1057, T1055]
background: false
output_extension:
needs_admin: false
opsec_safe: true
language: bof
min_language_version: ''
comments:
  - https://github.com/trustedsec/CS-Situational-Awareness-BOF
options:
  - name: Architecture
    description: Architecture of the beacon_funcs.o to generate with (x64 or x86).
    required: true
    value: x64
    strict: true
    suggested_values:
      - x64
      - x86
  - name: ModulePart
    description: Case-insensitive substring of the module path to search for across
      processes (e.g. clr.dll, winhttp.dll, amsi.dll).
    required: true
    value: 'clr.dll'
  - name: ProcessNamePart
    description: Optional case-insensitive substring of the process image name to
      restrict the search to (e.g. explorer). Leave blank to search every process.
    required: false
    value: ''
bof:
  x86: bof/situational_awareness/findLoadedModule/findLoadedModule.x86.o
  x64: bof/situational_awareness/findLoadedModule/findLoadedModule.x64.o
  entry_point: ''
  format_string: zz
script_path: ''
script_end: ''
