name: nslookup
authors:
  - name: Anthony Rose
    handle: '@Cx01N'
    link: https://twitter.com/Cx01N_
description: Performs a DNS lookup for the specified hostname using the Windows DNS
  client API. Optionally targets a specific DNS server and record type. Useful for
  network enumeration and verifying DNS resolution from the compromised host without
  invoking nslookup.exe.
software: ''
tactics: [TA0007]
techniques: [T1016, T1018]
background: false
output_extension:
needs_admin: false
opsec_safe: true
language: bof
min_language_version: ''
comments:
  - https://github.com/trustedsec/CS-Situational-Awareness-BOF
options:
  - name: Architecture
    description: Architecture of the beacon_funcs.o to generate with (x64 or x86).
    required: true
    value: x64
    strict: true
    suggested_values:
      - x64
      - x86
  - name: Target
    description: Hostname or domain name to resolve.
    required: true
    value: ''
  - name: Server
    description: DNS server to query. Leave blank to use the system default.
    required: false
    value: ''
  - name: RecordType
    description: DNS record type to query for the target.
    required: true
    value: A
    strict: true
    suggested_values:
      - A
      - AAAA
      - CNAME
      - MX
      - NS
      - TXT
bof:
  x86: bof/situational_awareness/nslookup/nslookup.x86.o
  x64: bof/situational_awareness/nslookup/nslookup.x64.o
  entry_point: ''
  format_string: zzs
script_path: ''
script_end: ''
advanced:
  custom_generate: true
