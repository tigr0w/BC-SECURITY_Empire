name: ldapsearch
authors:
  - name: Anthony Rose
    handle: '@Cx01N'
    link: https://twitter.com/Cx01N_
description: Beacon Object File (BOF) that runs LDAP or LDAPS queries against a domain
  controller directly from the agent, returning results without touching disk. Wraps
  the TrustedSec ldapsearch BOF to enumerate Active Directory objects such as users,
  groups, and computers using a raw LDAP filter, a configurable search scope, and
  an optional attribute list. Request '*,ntsecuritydescriptor' as the attributes
  to also return base64-encoded ACLs for offline parsing (e.g. BOFHound). Useful
  for in-agent domain reconnaissance when PowerView-style queries are too noisy or
  unavailable.
software: ''
tactics: [TA0007]
techniques: [T1087.002, T1069.002, T1018]
background: false
output_extension:
needs_admin: false
opsec_safe: true
language: bof
min_language_version: ''
comments:
  - https://github.com/trustedsec/CS-Situational-Awareness-BOF
options:
  - name: Architecture
    description: Architecture of the beacon_funcs.o to generate with (x64 or x86).
    required: true
    value: x64
    strict: true
    suggested_values:
      - x64
      - x86
  - name: Query
    description: LDAP search filter to execute, e.g. (objectClass=user).
    required: true
    value: '(objectClass=user)'
  - name: Attributes
    description: Comma-separated attributes to return; * returns all. Use '*,ntsecuritydescriptor'
      to also return base64-encoded ACLs.
    required: false
    value: '*'
  - name: ResultCount
    description: Maximum number of results to return. 0 returns all results.
    required: true
    value: '0'
  - name: Scope
    description: 'Search scope: 1 = base, 2 = one level, 3 = subtree.'
    required: true
    value: '3'
    strict: true
    suggested_values:
      - '1'
      - '2'
      - '3'
  - name: Hostname
    description: Domain controller to target. Leave blank to auto-resolve.
    required: false
    value: ''
  - name: SearchDN
    description: Base distinguished name to search from. Leave blank to use the domain's
      default naming context.
    required: false
    value: ''
  - name: UseLDAPS
    description: Connect over LDAPS on port 636 (1) instead of plain LDAP on 389
      (0).
    required: true
    value: '0'
    strict: true
    suggested_values:
      - '0'
      - '1'
bof:
  x86: bof/situational_awareness/ldapsearch/ldapsearch.x86.o
  x64: bof/situational_awareness/ldapsearch/ldapsearch.x64.o
  entry_point: ''
  format_string: zziizzi
script_path: ''
script_end: ''
