name: netuse_list
authors:
  - name: Anthony Rose
    handle: '@Cx01N'
    link: https://twitter.com/Cx01N_
description: Lists current network share connections via WNetEnumResource. When DeviceName
  is blank all active connections are enumerated; when a drive letter is specified
  only that connection is shown. Useful for mapping established lateral movement
  paths without spawning net.exe.
software: ''
tactics: [TA0007]
techniques: [T1135]
background: false
output_extension:
needs_admin: false
opsec_safe: true
language: bof
min_language_version: ''
comments:
  - https://github.com/trustedsec/CS-Situational-Awareness-BOF
options:
  - name: Architecture
    description: Architecture of the beacon_funcs.o to generate with (x64 or x86).
    required: true
    value: x64
    strict: true
    suggested_values:
      - x64
      - x86
  - name: DeviceName
    description: Drive letter to query (e.g. Z:). Leave blank to list all active
      network connections.
    required: false
    value: ''
bof:
  x86: bof/situational_awareness/netuse/netuse.x86.o
  x64: bof/situational_awareness/netuse/netuse.x64.o
  entry_point: ''
  format_string: sZ
script_path: ''
script_end: ''
advanced:
  custom_generate: true
