name: netuserenum
authors:
  - name: Anthony Rose
    handle: '@Cx01N'
    link: https://twitter.com/Cx01N_
description: Enumerates all user accounts on the local system or domain via NetUserEnum.
  The UseDomain flag selects local vs domain enumeration, and UserFilter controls
  which account types are returned (e.g. normal accounts, locked, disabled).
software: ''
tactics: [TA0007]
techniques: [T1087.001, T1087.002]
background: false
output_extension:
needs_admin: false
opsec_safe: true
language: bof
min_language_version: ''
comments:
  - https://github.com/trustedsec/CS-Situational-Awareness-BOF
options:
  - name: Architecture
    description: Architecture of the beacon_funcs.o to generate with (x64 or x86).
    required: true
    value: x64
    strict: true
    suggested_values:
      - x64
      - x86
  - name: UseDomain
    description: Enumerate domain user accounts. False enumerates local user accounts.
    required: true
    value: false
  - name: UserFilter
    description: Which account types to return. "All users" lists every account;
      "Locked out" and "Disabled" restrict to those states; "Active accounts only"
      excludes locked-out and disabled accounts.
    required: true
    value: All users
    strict: true
    suggested_values:
      - All users
      - Locked out
      - Disabled
      - Active accounts only
bof:
  x86: bof/situational_awareness/netuserenum/netuserenum.x86.o
  x64: bof/situational_awareness/netuserenum/netuserenum.x64.o
  entry_point: ''
  format_string: ii
script_path: ''
script_end: ''
advanced:
  custom_generate: true
