name: inject_amsi_bypass
authors:
  - name: boku
    handle: '@0xBoku'
    link: https://github.com/boku7
description: |
  Beacon Object File (BOF) that bypasses AMSI in a remote process by patching
  AmsiOpenSession in the target process memory. Uses syscalls (HellsGate/HalosGate)
  to write the bypass (xor rax,rax; ret) into the remote process. x64 only.
software: ''
tactics: [TA0004, TA0005, TA0112]
techniques: [T1055, T1685]
background: false
output_extension:
needs_admin: false
opsec_safe: false
language: bof
min_language_version: ''
comments:
  - https://github.com/sliverarmory/injectAmsiBypass
options:
  - name: InjectSelf
    description: Inject the AMSI bypass into the agent's own process. Set to False
      to target a specific remote PID.
    required: true
    value: true
  - name: Pid
    description: Process ID of the remote process to inject the AMSI bypass into.
      Only used when InjectSelf is False.
    required: true
    value: ''
    depends_on:
      - name: InjectSelf
        values: ['False']
bof:
  x86: ''
  x64: bof/injectAmsiBypass/inject-amsiBypass.x64.o
  entry_point: ''
  format_string: i
script_path: ''
script_end: ''
advanced:
  custom_generate: true
