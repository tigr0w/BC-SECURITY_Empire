name: syscalls_shellcode_injection
authors:
  - name: ajpc500
    handle: '@ajpc500'
    link: https://github.com/ajpc500/BOFs
description: |
  Beacon Object File (BOF) that injects shellcode into a remote process using
  direct syscalls (NtOpenProcess -> NtAllocateVirtualMemory -> NtWriteVirtualMemory
  -> NtCreateThreadEx). Fetches syscall stubs from the on-disk ntdll.dll at runtime
  to bypass in-memory API hooks. Generates Empire agent shellcode from the specified
  listener and injects into the target PID. x64 only.
software: ''
tactics: [TA0005]
techniques: [T1055]
background: false
output_extension:
needs_admin: false
opsec_safe: false
language: bof
min_language_version: ''
comments:
  - https://github.com/ajpc500/BOFs
options:
  - name: Listener
    description: Empire listener to generate shellcode for.
    required: true
    value: ''
  - name: Language
    description: Language of the agent shellcode to generate.
    required: true
    value: powershell
    strict: true
    suggested_values:
      - powershell
      - csharp
      - ironpython
  - name: Pid
    description: Process ID of the remote process to inject into.
    required: true
    value: ''
  - name: Architecture
    description: Architecture of the BOF to use (x64 only).
    required: true
    value: x64
    strict: true
    suggested_values:
      - x64
bof:
  x86: ''
  x64: bof/management/syscalls_shellcode_injection/syscallsinject.x64.o
  entry_point: ''
  format_string: 'ib'
script_path: ''
script_end: ''
advanced:
  custom_generate: true
