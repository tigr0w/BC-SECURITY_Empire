name: etw_patching
authors:
  - name: ajpc500
    handle: '@ajpc500'
    link: https://github.com/ajpc500/BOFs
description: |
  Beacon Object File (BOF) that patches (or reverts) EtwEventWrite in ntdll.dll
  to degrade ETW-based logging in the current process. Use 'stop' to blind ETW
  emit; use 'start' to revert the patch and restore logging. In-process only —
  does not target remote PIDs. Alternative to inject_etw_bypass when remote
  injection is not required. Credit: @xpn (original technique).
software: ''
tactics: [TA0005]
techniques: [T1562.006]
background: false
output_extension:
needs_admin: false
opsec_safe: false
language: bof
min_language_version: ''
comments:
  - https://github.com/ajpc500/BOFs
options:
  - name: Action
    description: Whether to patch out (stop) or restore (start) EtwEventWrite.
    required: true
    value: stop
    strict: true
    suggested_values:
      - stop
      - start
  - name: Architecture
    description: Architecture of the BOF to use (x64 or x86).
    required: true
    value: x64
    strict: true
    suggested_values:
      - x64
      - x86
bof:
  x86: bof/management/etw_patching/etw_patching.x86.o
  x64: bof/management/etw_patching/etw_patching.x64.o
  entry_point: ''
  format_string: 'z'
script_path: ''
script_end: ''
