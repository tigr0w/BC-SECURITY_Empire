name: Certify
authors:
  - name: Anthony Rose
    handle: Cx01N
    link: https://twitter.com/Cx01N_
description: |
  This module leverages Certify 2.0 to enumerate and exploit misconfigurations
  in Active Directory Certificate Services (AD CS). It can identify vulnerable certificate
  templates, request certificates on behalf of users, forge "golden" certificates from
  stolen CA keys, and escalate privileges by abusing insecure enrollment permissions.
  Certificates obtained may be used for domain persistence or impersonation via PKINIT
  and Kerberos.
software: ''
tactics: [TA0006]
techniques: [T1649]
background: true
output_extension:
needs_admin: false
opsec_safe: true
language: csharp
min_language_version: ''
options:
  - name: Command
    description: Certify 2.0 command to execute (run with no valid command to print
      usage).
    required: true
    value: help
    strict: false
    suggested_values:
      - help
      - enum-cas
      - enum-templates
      - enum-pkiobjects
      - request
      - request-agent
      - request-download
      - request-renew
      - forge
      - manage-ca
      - manage-template
      - manage-self
csharp:
  UnsafeCompile: false
  MergeReferences: true
  CompatibleDotNetVersions:
    - Net47
  Code: |
    using System;

    public static class Program
    {
        public static void Main(string[] args)
        {
            string command = string.Join(" ", args);

            try
            {
                Console.WriteLine(Certify.Program.MainString(command));
            }
            catch (Exception ex)
            {
                Console.WriteLine("[!] Unhandled Certify exception:");
                Console.WriteLine(ex);
            }
        }
    }
  ReferenceSourceLibraries:
    - Name: Certify
      Description: Certify is a C# tool to enumerate and abuse misconfigurations
        in Active Directory Certificate Services (AD CS).
      Location: Certify\
      Language: CSharp
      CompatibleDotNetVersions:
        - Net47
      ReferenceAssemblies: []
      EmbeddedResources: []
  ReferenceAssemblies: []
  EmbeddedResources: []
