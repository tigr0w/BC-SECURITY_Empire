id: http_foreign
display_name: 'HTTP[S]'
authors:
  - name: Will Schroeder
    handle: '@harmj0y'
    link: https://twitter.com/harmj0y
description: Starts a 'foreign' http[s] Empire listener.
comments: []
software: ''
techniques: []
tactics: []
options:
  - name: Name
    description: Name for the listener.
    required: true
    value: http_foreign
  - name: Host
    description: Hostname/IP for staging.
    required: true
    value: ''
  - name: Port
    description: Port for the listener.
    required: true
    value: 80
    suggested_values:
      - 80
      - 443
  - name: Launcher
    description: Launcher string.
    required: true
    value: 'powershell -noP -sta -w 1 -enc '
  - name: StagingKey
    description: Staging key for initial agent negotiation.
    required: true
    value: 2c103f2c4ed1e59c0b4e2e01821770fa
  - name: Cookie
    description: Custom Cookie Name
    required: true
    value: session
  - name: RoutingPacket
    description: Routing packet from the targeted listener
    required: true
    value: ''
  - name: DefaultDelay
    description: Agent delay/reach back interval (in seconds).
    required: true
    value: 5
  - name: DefaultJitter
    description: Jitter in agent reachback interval (0.0-1.0).
    required: true
    value: 0.0
  - name: DefaultLostLimit
    description: Number of missed checkins before exiting
    required: true
    value: 60
  - name: DefaultProfile
    description: Default communication profile for the agent.
    required: true
    value: '/admin/get.php,/news.php,/login/process.php|Mozilla/5.0 (Windows NT 6.1;
      WOW64; Trident/7.0; rv:11.0) like Gecko'
  - name: KillDate
    description: Date for the listener to exit (MM/dd/yyyy).
    required: false
    value: ''
  - name: WorkingHours
    description: Hours for the agent to operate (09:00-17:00).
    required: false
    value: ''
