suppress_self_cert_warning: true
obfuscation:
  timeout: 300
api:
  port: 1337
server:
  socketio: true
database:
  use: mysql
  mysql:
    url: localhost:3306
    username: empire_user
    password: empire_password
    database_name: test_empire
    # Small per-worker pool so pytest-xdist doesn't exhaust MySQL's connection
    # ceiling (default max_connections=151): N workers each open up to
    # pool_size+max_overflow connections. 5+5=10/worker stays safe well past the
    # worker counts any CI runner (or a many-core dev box) will spawn. Tests that
    # exercise pool-exhaustion behavior build their own pool_size=1 engines.
    pool_size: 5
    max_overflow: 5
  sqlite:
    location: test_empire.db
  defaults:
    # staging key will first look at OS environment variables, then here.
    staging_key: ""
    username: empireadmin
    password: password123
    obfuscation:
      - language: powershell
        enabled: false
        command: "Token\\All\\1"
        module: "invoke-obfuscation"
        preobfuscatable: true
      - language: csharp
        enabled: false
        command: ""
        module: "confuser"
        preobfuscatable: false
      - language: python
        enabled: false
        command: ""
        module: "python-obfuscator"
        preobfuscatable: false
    keyword_obfuscation:
      - Invoke-Empire
      - Invoke-Mimikatz
    bypasses:
      - mattifestation
      - etw
empire_compiler:
  repo: BC-SECURITY/Empire-Compiler
  ref: v1.1.0-a.9
  confuser_proj: empire/server/data/confuser.crproj
starkiller:
  # Disabled in tests: no test serves the Starkiller SPA, so cloning/building it
  # at boot is pure overhead. _warm_external_caches and app.initialize skip it
  # when disabled.
  enabled: false
  repo: https://github.com/BC-SECURITY/Starkiller.git
  # Can be a branch, tag, or commit hash
  ref: v2.8.2
submodules:
  auto_update: true
plugin_marketplace:
  registries:
    - name: BC-SECURITY
      location: test_registry_1.yaml
    - name: BC-SECURITY-TEST
      location: test_registry_2.yaml
directories:
  downloads: downloads
keyword_obfuscation:
  # List of keywords to obfuscate
  - Invoke-Empire
  - Invoke-Mimikatz
logging:
  level: INFO
  simple_console: true
debug:
  last_task:
    enabled: true
    file: debug/last_task.txt
