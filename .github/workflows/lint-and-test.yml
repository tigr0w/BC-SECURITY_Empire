name: Lint and Test
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pre-commit/action@v3.0.1
  matrix-prep-config:
    runs-on: ubuntu-latest
    steps:
      - id: release
        if: ${{ startsWith(github.head_ref, 'release/') || contains( github.event.pull_request.labels.*.name,
          'run-all-versions') }}
        run: |
          echo "config={\"python-version\": [\"3.13\", \"3.14\"]}" >> $GITHUB_OUTPUT
      - id: not-release
        if: ${{ !startsWith(github.head_ref, 'release/') }}
        run: |
          echo "config={\"python-version\": [\"3.14\"]}" >> $GITHUB_OUTPUT
    outputs:
      config: ${{ steps.release.outputs.config || steps.not-release.outputs.config
        }}
  test:
    needs:
      - matrix-prep-config
      - lint
    timeout-minutes: 30
    runs-on: ubuntu-latest
    name: Test Python ${{ matrix.python-version }}
    strategy:
      matrix: ${{ fromJson(needs.matrix-prep-config.outputs.config) }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Poetry
        run: |
          curl -sL https://install.python-poetry.org | python - -y
      # Poetry cache depends on OS, Python version and Poetry version.
      # https://gist.github.com/gh640/233a6daf68e9e937115371c0ecd39c61
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'poetry'
      - name: Set up MySQL
        run: |
          sudo systemctl start mysql
          mysql -u root -proot -e "CREATE USER IF NOT EXISTS 'empire_user'@'localhost' IDENTIFIED BY 'empire_password';" || true
          mysql -u root -proot -e "GRANT ALL PRIVILEGES ON *.* TO 'empire_user'@'localhost' WITH GRANT OPTION;" || true
          mysql -u root -proot -e "FLUSH PRIVILEGES;" || true
      - name: Install dependencies
        run: |
          poetry env use ${{ matrix.python-version }}
          poetry install
          sudo apt-get update
          # Only x86_64-w64-mingw32-gcc is invoked by the C stager tests
          # (empire/server/stagers/windows/c_launcher.py:114). Installing
          # gcc-mingw-w64-x86-64 instead of the mingw-w64 meta-package
          # avoids pulling in the i686 toolchain (~150MB → ~80MB
          # download).
          sudo apt-get install -y mono-runtime gcc-mingw-w64-x86-64 perl
      - name: Cache external test deps (empire-compiler + starkiller + go cache)
        # The test app boot downloads a ~540MB empire-compiler + clones Starkiller
        # into DATA_DIR (~/.local/share/empire-test), and go stager builds populate
        # a GOCACHE under CACHE_DIR (~/.cache/empire-test/go-build). These are keyed
        # on the pinned refs in test_server_config (+ the gopire source for the go
        # cache), so a ref bump busts the cache. Combined with conftest no longer
        # wiping these dirs, a cache hit skips the download/clone entirely and warms
        # cold go builds.
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/empire-test/empire-compiler
            ~/.local/share/empire-test/starkiller
            ~/.cache/empire-test
          key: empire-test-deps-v1-${{ runner.os }}-${{ hashFiles('empire/test/test_server_config.yaml',
            'empire/server/data/agent/gopire/**') }}
          restore-keys: |
            empire-test-deps-v1-${{ runner.os }}-
      - name: Run test suite - mysql
        # Authenticate the Empire Compiler download against the GitHub API so it
        # isn't throttled by the unauthenticated 60 req/hr shared-runner limit.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # On release branches / the run-all-versions label, run the full suite
          # including release_only tests (the heavy SharpHound/Rubeus C# compiles).
          # On normal PRs those two are deselected to keep the wall low; every
          # other C# module still compiles, and the pair runs before a release.
          RELEASE_RUN: ${{ startsWith(github.head_ref, 'release/') || contains(github.event.pull_request.labels.*.name,
            'run-all-versions') }}
        run: |
          set -o pipefail
          # Parallelized via pytest-xdist. --dist=loadfile keeps every test in a
          # file on one worker, preserving each file's per-DB-state ordering (each
          # worker runs whole files against its own per-worker DB). test_performance
          # is excluded here — those tests drive their own concurrency and conflict
          # with xdist workers; they run in a separate parallel job (test_performance).
          # release_only (SharpHound/Rubeus compiles) is deselected except on release.
          MARKEXPR="not release_only"
          if [ "$RELEASE_RUN" = "true" ]; then MARKEXPR=""; fi
          if [ "${{ matrix.python-version }}" = "3.14" ]; then
            DATABASE_USE=mysql poetry run pytest -v --runslow --durations=10 -n auto --dist=loadfile --ignore=empire/test/test_performance -m "$MARKEXPR" --cov=empire/server --junitxml=pytest.xml --cov-report=term-missing:skip-covered . | tee pytest-coverage.txt
          else
            DATABASE_USE=mysql poetry run pytest -v --runslow --durations=10 -n auto --dist=loadfile --ignore=empire/test/test_performance -m "$MARKEXPR" .
          fi
      - name: Run test suite - sqlite
        if: ${{ startsWith(github.head_ref, 'release/') || contains(github.event.pull_request.labels.*.name,
          'test-sqlite') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATABASE_USE=sqlite poetry run pytest . -v --runslow --durations=10 -n auto --dist=loadfile --ignore=empire/test/test_performance -m "not mysql"
      - name: Pytest coverage comment
        if: ${{ matrix.python-version == '3.14' }}
        uses: MishaKav/pytest-coverage-comment@v1.11.0
        with:
          pytest-coverage-path: ./pytest-coverage.txt
          junitxml-path: ./pytest.xml
  # Performance tests run in their own job (in parallel with `test`) so their
  # self-driven pool/concurrency stays off the main suite's critical path and out
  # of xdist's way. They run serially within this job.
  test_performance:
    needs:
      - lint
    timeout-minutes: 30
    runs-on: ubuntu-latest
    name: Performance Tests
    steps:
      - uses: actions/checkout@v7
      - name: Install Poetry
        run: |
          curl -sL https://install.python-poetry.org | python - -y
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'poetry'
      - name: Set up MySQL
        run: |
          sudo systemctl start mysql
          mysql -u root -proot -e "CREATE USER IF NOT EXISTS 'empire_user'@'localhost' IDENTIFIED BY 'empire_password';" || true
          mysql -u root -proot -e "GRANT ALL PRIVILEGES ON *.* TO 'empire_user'@'localhost' WITH GRANT OPTION;" || true
          mysql -u root -proot -e "FLUSH PRIVILEGES;" || true
      - name: Install dependencies
        run: |
          poetry env use 3.14
          poetry install
          sudo apt-get update
          sudo apt-get install -y mono-runtime gcc-mingw-w64-x86-64 perl
      - name: Cache external test deps (empire-compiler + starkiller)
        # Distinct key from the `test` job so the two parallel jobs don't race to
        # save the same cache. The perf suite doesn't build go stagers, so no go
        # cache here.
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/empire-test/empire-compiler
            ~/.local/share/empire-test/starkiller
          key: empire-perf-deps-${{ runner.os }}-${{ hashFiles('empire/test/test_server_config.yaml')
            }}
          restore-keys: |
            empire-perf-deps-${{ runner.os }}-
      - name: Run performance test suite - mysql
        # Authenticate the Empire Compiler download against the GitHub API so it
        # isn't throttled by the unauthenticated 60 req/hr shared-runner limit.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATABASE_USE=mysql poetry run pytest -v --runslow --durations=10 empire/test/test_performance
  test_wheel:
    # Nothing here publishes a wheel -- downstream packagers (nixpkgs) build
    # one from source -- so this job is all that stands between an edit to
    # `packages` and a broken distro package. Build, inspect, install into a
    # throwaway venv and probe it: about a minute, no database, no compiler.
    needs:
      - lint
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Test Wheel
    steps:
      - uses: actions/checkout@v7
      - name: Install Poetry
        run: |
          curl -sL https://install.python-poetry.org | python - -y
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'poetry'
      - name: Build wheel
        run: poetry build --format wheel
      - name: Assert wheel contents
        run: python .github/scripts/check_wheel.py
      - name: Install the wheel into a clean venv
        # --no-deps: empire.main and empire.arguments are stdlib-only and
        # paths needs only platformdirs, so the entry point and the installed
        # asset tree both verify in seconds. Resolving Empire's real
        # dependency closure is the `test` job's business.
        run: |
          python -m venv "$HOME/wheel-venv"
          "$HOME/wheel-venv/bin/pip" install --no-deps \
            dist/empire_bc_security_fork-*.whl platformdirs
      - name: Probe the install from /
        # From /, because resolving package files against the CWD rather than
        # the package is the bug this job exists to catch.
        run: |
          cd /
          "$HOME/wheel-venv/bin/python" \
            "$GITHUB_WORKSPACE/.github/scripts/probe_wheel_install.py"
  test_image:
    # To save CI time, only run these tests on the release PRs
    if: ${{ startsWith(github.head_ref, 'release/') || contains( github.event.pull_request.labels.*.name,
      'docker') }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    name: Test Docker Image
    steps:
      - uses: actions/checkout@v7
      - name: Set up SSH
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AUTH_PID=$SSH_AUTH_PID" >> $GITHUB_ENV
          if [ -n "$CI_SSH_KEY_BOT" ]; then echo "$CI_SSH_KEY_BOT" | tr -d '\r' | ssh-add -; fi
          mkdir -p ~/.ssh
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/known_hosts
        env:
          CI_SSH_KEY_BOT: ${{ secrets.CI_SSH_KEY_BOT }}
      - name: Build docker image
        run: DOCKER_BUILDKIT=1 docker compose -f .github/docker-compose.yml build
      - name: Run tests on docker image
        # Forwarded into the container (see docker-compose.yml) so the Empire
        # Compiler download is authenticated and not rate-limited.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: docker compose -f .github/docker-compose.yml run test
      - name: run structure tests docker
        uses: plexsystems/container-structure-test-action@v0.3.0
        with:
          image: bcsecurity/empire-test:latest
          config: .github/cst-config-docker.yaml
  test_install_script:
    needs: test
    timeout-minutes: 45
    runs-on: ubuntu-latest
    name: Test Install Script
    strategy:
      matrix:
        # Each image builds individually to avoid running out of disk space.
        # The OpenSSL cross-compilation for MinGW makes each image too large
        # to build multiple in parallel on a single runner.
        images:
          - ['debian11']
          - ['debian12']
          - ['debian13']
          - ['ubuntu2204']
          - ['ubuntu2404']
          - ['kalirolling'] # 'parrotrolling'
          # Parrot disabled for now because the apt repo is having some slowness issues.
          # Install is running up way too many minutes.
    steps:
      - uses: actions/checkout@v7
        with:
          depth: 0
      - name: Set up SSH
        run: |
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> $GITHUB_ENV
          echo "SSH_AUTH_PID=$SSH_AUTH_PID" >> $GITHUB_ENV
          if [ -n "$CI_SSH_KEY_BOT" ]; then echo "$CI_SSH_KEY_BOT" | tr -d '\r' | ssh-add -; fi
          mkdir -p ~/.ssh
          ssh-keyscan -t rsa,ecdsa,ed25519 github.com >> ~/.ssh/known_hosts
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/known_hosts
        env:
          CI_SSH_KEY_BOT: ${{ secrets.CI_SSH_KEY_BOT }}
      # To save CI time, only run these tests when the install script or deps changed
      - name: Get changed files using defaults
        id: changed-files
        uses: tj-actions/changed-files@v47.0.6
      - name: Build images
        if: ${{ contains(steps.changed-files.outputs.modified_files, 'setup/install.sh')
          || contains(steps.changed-files.outputs.modified_files, 'poetry.lock')
          || contains(steps.changed-files.outputs.modified_files, '.github/install_tests')
          || startsWith(github.head_ref, 'release/') }}
        run: |
          DOCKER_BUILDKIT=1 docker compose \
            -f .github/install_tests/docker-compose-install-tests.yml \
            build --ssh default --parallel ${{ join(matrix.images, ' ') }}
      - name: run install tests
        if: ${{ contains(steps.changed-files.outputs.modified_files, 'setup/install.sh')
          || contains(steps.changed-files.outputs.modified_files, 'poetry.lock')
          || contains(steps.changed-files.outputs.modified_files, '.github/install_tests')
          || startsWith(github.head_ref, 'release/') }}
        # Using a script instead of prepackaged action because composite actions can't uses
        # a matrix and this is way simpler to read.
        run: |
          curl -LO https://storage.googleapis.com/container-structure-test/latest/container-structure-test-linux-amd64 && \
            chmod +x container-structure-test-linux-amd64 && \
            mkdir -p $HOME/bin && \
            export PATH=$PATH:$HOME/bin && \
            mv container-structure-test-linux-amd64 $HOME/bin/container-structure-test
            ./.github/install_tests/run-all-cst.sh ${{ join(matrix.images, ' ') }}
