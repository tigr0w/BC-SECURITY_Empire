schemaVersion: 2.0.0
commandTests:
  - name: "poetry python"
    command: "poetry"
    args: ["run", "which", "python3"]
    expectedOutput: ["/usr/local/bin/python3"]
  - name: "python3 version"
    command: "python3"
    args: ["--version"]
    expectedOutput: ["Python 3.14.*"]
  - name: "poetry"
    command: "which"
    args: ["poetry"]
    expectedOutput: ["/usr/bin/poetry"]
  - name: "poetry version"
    command: "poetry"
    args: ["--version"]
    expectedOutput: ["Poetry (version 1.6*)*"]
  - name: "poetry python version"
    command: "poetry"
    args: ["run", "python3", "--version"]
    expectedOutput: ["Python 3.14.*"]
  - name: "powershell which"
    command: "which"
    args: ["pwsh"]
    expectedOutput: ["/usr/bin/pwsh"]
  - name: "powershell version"
    command: "pwsh"
    args: ["--version"]
    expectedOutput: ["PowerShell 7.*"]
  - name: "ps-empire help"
    command: "./ps-empire"
    args: ["-f", "server", "--help"]
    expectedOutput: ["usage: empire.py server [-h]*"]
  - name: "ps-empire version"
    command: "./ps-empire"
    args: ["-f", "server", "--version"]
    expectedOutput: ["7.* BC Security Fork"]
  - name: "go which"
    command: "which"
    args: ["go"]
    expectedOutput: ["/usr/bin/go"]
  - name: "go version"
    command: "go"
    args: ["version"]
    expectedOutput: ["go version go1.23.* linux/*"]
  - name: "mingw64 gcc exists"
    command: "which"
    args: ["x86_64-w64-mingw32-gcc"]
    expectedOutput: ["/usr/bin/x86_64-w64-mingw32-gcc"]
  - name: "perl exists"
    command: "which"
    args: ["perl"]
    expectedOutput: ["/usr/bin/perl"]
  # A floor, not the exact count: this job does not run on ordinary pull
  # requests, so an exact number turns "someone added a profile" into a
  # release-time failure for whoever cuts the release. What it has to catch is
  # the tree not reaching the image at all.
  - name: "profiles-shipped"
    command: "bash"
    args: ["-c", "test $(find /empire/empire/server/data/profiles -name '*.profile'
        | wc -l) -gt 50 && echo shipped"]
    # Unanchored: container-structure-test matches with Go's regexp, where `$`
    # is end-of-text and does not skip the newline `echo` writes. The command
    # prints nothing at all when the floor is not met, so this is exact enough.
    expectedOutput: ["shipped"]
fileExistenceTests:
  - name: 'profiles'
    path: '/empire/empire/server/data/profiles/'
    shouldExist: true
  # The redistribution obligation NOTICE.md records covers container images too,
  # not just the wheel that .github/scripts/check_wheel.py gates.
  - name: 'profiles third-party notice'
    path: '/empire/empire/server/data/profiles/NOTICE.md'
    shouldExist: true
  - name: 'profiles license texts'
    path: '/empire/empire/server/data/profiles/LICENSES/GPL-3.0.txt'
    shouldExist: true
  - name: 'starkiller'
    path: '/root/.local/share/empire/starkiller/'
    shouldExist: true
  - name: 'empire-compiler'
    path: '/root/.local/share/empire/empire-compiler/'
    shouldExist: true
  - name: 'plugin-registries'
    path: '/root/.local/share/empire/plugin-registries/BC-SECURITY/7.x/registry.yaml'
    shouldExist: true
  - name: 'openssl mingw prefix'
    path: '/opt/openssl-mingw64/'
    shouldExist: true
  - name: 'openssl mingw headers'
    path: '/opt/openssl-mingw64/include/openssl/ssl.h'
    shouldExist: true
